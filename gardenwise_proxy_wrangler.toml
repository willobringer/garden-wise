# GardenWise Proxy — Cloudflare Worker Configuration
# ─────────────────────────────────────────────────────
# This file is used if you deploy via the Wrangler CLI instead of
# the Cloudflare dashboard. Both methods produce identical results.
#
# CLI deployment (optional — dashboard is easier for beginners):
#   npm install -g wrangler
#   wrangler login
#   wrangler deploy
#   wrangler secret put ANTHROPIC_API_KEY   (paste your key when prompted)

name = "gardenwise-proxy"
main = "worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# KV namespace for rate limiting
# After creating a KV namespace in the dashboard named "GW_RATE_LIMIT",
# replace the id value below with your real KV namespace ID.
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Environment variables (non-secret — safe to commit)
[vars]
APP_NAME = "GardenWise"
APP_VERSION = "1.0.0"

# Secrets are set via dashboard or `wrangler secret put ANTHROPIC_API_KEY`
# Never put your actual API key in this file.

# Optional: add a custom domain route
# [[routes]]
# pattern = "api.gardenwise.app/*"
# zone_name = "gardenwise.app"
